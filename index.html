<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Vault | Top AI Tools Directory 2026</title>
    <meta name="description" content="Discover the best AI tools for writing, coding, video, and productivity.">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }
        body {
            background-color: #0d0d12;
            color: #ffffff;
            line-height: 1.6;
        }
        header {
            text-align: center;
            padding: 60px 20px 30px;
            background: linear-gradient(180deg, #1a1a2e 0%, #0d0d12 100%);
            border-bottom: 1px solid #2a2a35;
        }
        header h1 {
            font-size: 3rem;
            color: #fff;
            margin-bottom: 15px;
        }
        header h1 span {
            color: #00e5ff;
        }
        header p {
            color: #8892b0;
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto;
        }
       .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
       .category-filters {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
       .filter-btn {
            background: #1e1e2f;
            color: #fff;
            border: 1px solid #3a3a4c;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 500;
        }
       .filter-btn:hover,.filter-btn.active {
            background: #00e5ff;
            color: #000;
            border-color: #00e5ff;
        }
       .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }
       .tool-card {
            background: #151520;
            border: 1px solid #2a2a35;
            border-radius: 12px;
            padding: 25px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
       .tool-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 229, 255, 0.1);
            border-color: #00e5ff;
        }
       .tool-category {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #00e5ff;
            margin-bottom: 10px;
            display: inline-block;
            background: rgba(0, 229, 255, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
        }
       .tool-name {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
       .tool-desc {
            color: #8892b0;
            font-size: 0.95rem;
            margin-bottom: 20px;
            height: 65px;
            overflow: hidden;
        }
       .tool-link {
            display: block;
            text-align: center;
            background: #ffffff;
            color: #000000;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            transition: 0.3s;
        }
       .tool-link:hover {
            background: #00e5ff;
        }
    </style>
</head>
<body>

    <header>
        <h1>AI <span>Vault</span></h1>
        <p>Your ultimate directory of the most powerful AI tools to 10x your productivity.</p>
    </header>

    <div class="container">
        <div class="category-filters">
            <button class="filter-btn active" onclick="filterTools('All')">All Tools</button>
            <button class="filter-btn" onclick="filterTools('Writing & Text')">Writing</button>
            <button class="filter-btn" onclick="filterTools('Video & Audio')">Video & Audio</button>
            <button class="filter-btn" onclick="filterTools('Image & Design')">Image & Design</button>
            <button class="filter-btn" onclick="filterTools('Coding')">Coding</button>
            <button class="filter-btn" onclick="filterTools('Productivity')">Productivity</button>
        </div>

        <div class="tools-grid" id="toolsGrid"></div>
    </div>

    <script>
        // Massive Database of 40+ Top AI Tools
        const aiTools =;

        // Function to display tools on the page
        function displayTools(toolsToShow) {
            const grid = document.getElementById('toolsGrid');
            grid.innerHTML = ''; 

            toolsToShow.forEach(tool => {
                const card = document.createElement('div');
                card.className = 'tool-card';
                card.innerHTML = `
                    <span class="tool-category">${tool.category}</span>
                    <h2 class="tool-name">${tool.name}</h2>
                    <p class="tool-desc">${tool.description}</p>
                    <a href="${tool.url}" target="_blank" class="tool-link">Try ${tool.name} ↗</a>
                `;
                grid.appendChild(card);
            });
        }

        // Function to filter tools by category
        function filterTools(category) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (category === 'All') {
                displayTools(aiTools);
            } else {
                const filtered = aiTools.filter(tool => tool.category === category);
                displayTools(filtered);
            }
        }

        // Load all tools when the website opens
        displayTools(aiTools);
    </script>
</body>
</html>
